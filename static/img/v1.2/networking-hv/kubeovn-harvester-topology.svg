<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
  <style>
    .box { fill: none; stroke: #c45a08; stroke-width: 2.5; }
    .text { font-family: "Arial", sans-serif; font-size: 16px; fill: #000000; }
    .title { font-size: 20px; font-weight: 600; }
    .arrow { stroke: #c45a08; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#c45a08" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" class="text title">
    Hypervisor + Kube-OVN Integration Architecture (Multi-VPC, Text-Based)
  </text>

  <!-- Outer frame -->
  <rect x="40" y="50" width="920" height="780" class="box"/>

  <!-- Kube-OVN frame -->
  <rect x="70" y="80" width="860" height="320" class="box"/>
  <text x="500" y="110" text-anchor="middle" class="text">Kube-OVN (SDN Controller / IPAM)</text>

  <!-- VPC 1 -->
  <rect x="110" y="140" width="350" height="220" class="box"/>
  <text x="285" y="165" text-anchor="middle" class="text">VPC: vpc-1</text>

  <rect x="150" y="195" width="90" height="60" class="box"/>
  <text x="195" y="225" text-anchor="middle" class="text">vswitch1<tspan x="195" dy="18">subnet</tspan></text>

  <rect x="255" y="195" width="90" height="60" class="box"/>
  <text x="300" y="225" text-anchor="middle" class="text">vswitch2<tspan x="300" dy="18">subnet</tspan></text>

  <rect x="360" y="195" width="90" height="60" class="box"/>
  <text x="405" y="225" text-anchor="middle" class="text">vswitch3<tspan x="405" dy="18">subnet</tspan></text>

  <!-- VPC 2 -->
  <rect x="540" y="140" width="350" height="220" class="box"/>
  <text x="715" y="165" text-anchor="middle" class="text">VPC: vpc-2</text>

  <rect x="580" y="195" width="90" height="60" class="box"/>
  <text x="625" y="225" text-anchor="middle" class="text">vswitch4<tspan x="625" dy="18">subnet</tspan></text>

  <rect x="685" y="195" width="90" height="60" class="box"/>
  <text x="730" y="225" text-anchor="middle" class="text">vswitch5<tspan x="730" dy="18">subnet</tspan></text>

  <rect x="790" y="195" width="90" height="60" class="box"/>
  <text x="835" y="225" text-anchor="middle" class="text">vswitch6<tspan x="835" dy="18">subnet</tspan></text>

  <!-- Hypervisor Overlay frame -->
  <rect x="70" y="430" width="860" height="300" class="box"/>
  <text x="500" y="455" text-anchor="middle" class="text">Hypervisor Overlay</text>

  <!-- Overlay switches row -->
  <rect x="150" y="500" width="90" height="60" class="box"/>
  <text x="195" y="530" text-anchor="middle" class="text">Hypervisor<tspan x="195" dy="18">overlay vswitch1</tspan></text>

  <rect x="255" y="500" width="90" height="60" class="box"/>
  <text x="300" y="530" text-anchor="middle" class="text">Hypervisor<tspan x="300" dy="18">overlay vswitch2</tspan></text>

  <rect x="360" y="500" width="90" height="60" class="box"/>
  <text x="405" y="530" text-anchor="middle" class="text">Hypervisor<tspan x="405" dy="18">overlay vswitch3</tspan></text>

  <rect x="580" y="500" width="90" height="60" class="box"/>
  <text x="625" y="530" text-anchor="middle" class="text">Hypervisor<tspan x="625" dy="18">overlay vswitch4</tspan></text>

  <rect x="685" y="500" width="90" height="60" class="box"/>
  <text x="730" y="530" text-anchor="middle" class="text">Hypervisor<tspan x="730" dy="18">overlay vswitch5</tspan></text>

  <rect x="790" y="500" width="90" height="60" class="box"/>
  <text x="835" y="530" text-anchor="middle" class="text">Hypervisor<tspan x="835" dy="18">overlay vswitch6</tspan></text>

  <!-- VM row -->
  <rect x="150" y="600" width="90" height="60" class="box"/>
  <text x="195" y="630" text-anchor="middle" class="text">VM1 vswitch1</text>

  <rect x="255" y="600" width="90" height="60" class="box"/>
  <text x="300" y="630" text-anchor="middle" class="text">VM1 vswitch2</text>

  <rect x="360" y="600" width="90" height="60" class="box"/>
  <text x="405" y="630" text-anchor="middle" class="text">VM1 vpcpeer1</text>

  <rect x="580" y="600" width="90" height="60" class="box"/>
  <text x="625" y="630" text-anchor="middle" class="text">VM2 vswitch3</text>

  <rect x="685" y="600" width="90" height="60" class="box"/>
  <text x="730" y="630" text-anchor="middle" class="text">VM external</text>

  <rect x="790" y="600" width="90" height="60" class="box"/>
  <text x="835" y="630" text-anchor="middle" class="text">VM2 vpcpeer2</text>

  <!-- Arrows from subnets to overlay switches -->
  <line x1="195" y1="255" x2="195" y2="500" class="arrow"/>
  <line x1="300" y1="255" x2="300" y2="500" class="arrow"/>
  <line x1="405" y1="255" x2="405" y2="500" class="arrow"/>

  <line x1="625" y1="255" x2="625" y2="500" class="arrow"/>
  <line x1="730" y1="255" x2="730" y2="500" class="arrow"/>
  <line x1="835" y1="255" x2="835" y2="500" class="arrow"/>

  <!-- Arrows from overlay switches to VMs -->
  <line x1="195" y1="560" x2="195" y2="600" class="arrow"/>
  <line x1="300" y1="560" x2="300" y2="600" class="arrow"/>
  <line x1="405" y1="560" x2="405" y2="600" class="arrow"/>

  <line x1="625" y1="560" x2="625" y2="600" class="arrow"/>
  <line x1="730" y1="560" x2="730" y2="600" class="arrow"/>
  <line x1="835" y1="560" x2="835" y2="600" class="arrow"/>

  <!-- Footer text -->
  <text x="500" y="690" text-anchor="middle" class="text">VM launched and managed by Hypervisor</text>
  <text x="500" y="715" text-anchor="middle" class="text">Connected (VPC peering)</text>
  <text x="500" y="740" text-anchor="middle" class="text">NatOutgoing: true</text>
</svg>
