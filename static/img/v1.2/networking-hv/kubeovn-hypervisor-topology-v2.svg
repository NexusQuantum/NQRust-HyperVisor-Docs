<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">

<style>
.box{fill:none;stroke:#C65A00;stroke-width:2;}
.line{stroke:#C65A00;stroke-width:2;}
.arrow{stroke:#C65A00;stroke-width:2;marker-end:url(#arrow);}
text{font-family:"Times New Roman";font-size:14px;}
.title{font-size:20px;font-weight:bold;}
</style>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
<polygon points="0 0,6 3,0 6" fill="#C65A00"/>
</marker>
</defs>

<!-- TITLE -->
<text x="590" y="30" text-anchor="middle" class="title">
Hypervisor + Kube-OVN Integration Architecture (Multi-VPC, Text-Based)
</text>

<!-- OUTER -->
<rect x="10" y="50" width="1160" height="650" class="box"/>

<!-- KUBE OVN -->
<rect x="30" y="70" width="1120" height="260" class="box"/>
<text x="590" y="95" text-anchor="middle">
Kube-OVN (SDN Controller / IPAM)
</text>

<!-- VPC1 -->
<rect x="120" y="130" width="360" height="160" class="box"/>
<text x="300" y="155" text-anchor="middle">VPC: vpc-1</text>

<rect x="140" y="190" width="90" height="55" class="box"/>
<text x="185" y="215" text-anchor="middle">vswitch1</text>
<text x="185" y="232" text-anchor="middle">subnet</text>

<rect x="255" y="190" width="90" height="55" class="box"/>
<text x="300" y="215" text-anchor="middle">vswitch2</text>
<text x="300" y="232" text-anchor="middle">subnet</text>

<rect x="370" y="190" width="90" height="55" class="box"/>
<text x="415" y="215" text-anchor="middle">vswitch3</text>
<text x="415" y="232" text-anchor="middle">subnet</text>

<!-- VPC2 -->
<rect x="700" y="130" width="360" height="160" class="box"/>
<text x="880" y="155" text-anchor="middle">VPC: vpc-2</text>

<rect x="720" y="190" width="90" height="55" class="box"/>
<text x="765" y="215" text-anchor="middle">vswitch4</text>
<text x="765" y="232" text-anchor="middle">subnet</text>

<rect x="835" y="190" width="90" height="55" class="box"/>
<text x="880" y="215" text-anchor="middle">vswitch5</text>
<text x="880" y="232" text-anchor="middle">subnet</text>

<rect x="950" y="190" width="90" height="55" class="box"/>
<text x="995" y="215" text-anchor="middle">vswitch6</text>
<text x="995" y="232" text-anchor="middle">subnet</text>

<!-- BACKBONE -->
<line x1="120" y1="330" x2="1040" y2="330" class="line"/>

<!-- BACKBONE → SUBNET -->
<line x1="185" y1="330" x2="185" y2="245" class="arrow"/>
<line x1="300" y1="330" x2="300" y2="245" class="arrow"/>
<line x1="415" y1="330" x2="415" y2="245" class="arrow"/>

<line x1="765" y1="330" x2="765" y2="245" class="arrow"/>
<line x1="880" y1="330" x2="880" y2="245" class="arrow"/>
<line x1="995" y1="330" x2="995" y2="245" class="arrow"/>

<!-- LOWER AREA -->
<rect x="30" y="350" width="1120" height="280" class="box"/>

<!-- HYPERVISOR OVERLAY -->
<rect x="125" y="380" width="120" height="70" class="box"/>
<text x="185" y="405" text-anchor="middle">Hypervisor</text>
<text x="185" y="423" text-anchor="middle">Overlay</text>
<text x="185" y="441" text-anchor="middle">vswitch1</text>

<rect x="240" y="380" width="120" height="70" class="box"/>
<text x="300" y="405" text-anchor="middle">Hypervisor</text>
<text x="300" y="423" text-anchor="middle">Overlay</text>
<text x="300" y="441" text-anchor="middle">vswitch2</text>

<rect x="355" y="380" width="120" height="70" class="box"/>
<text x="415" y="405" text-anchor="middle">Hypervisor</text>
<text x="415" y="423" text-anchor="middle">Overlay</text>
<text x="415" y="441" text-anchor="middle">vswitch3</text>

<rect x="705" y="380" width="120" height="70" class="box"/>
<text x="765" y="405" text-anchor="middle">Hypervisor</text>
<text x="765" y="423" text-anchor="middle">Overlay</text>
<text x="765" y="441" text-anchor="middle">vswitch4</text>

<rect x="820" y="380" width="120" height="70" class="box"/>
<text x="880" y="405" text-anchor="middle">Hypervisor</text>
<text x="880" y="423" text-anchor="middle">Overlay</text>
<text x="880" y="441" text-anchor="middle">vswitch5</text>

<rect x="935" y="380" width="120" height="70" class="box"/>
<text x="995" y="405" text-anchor="middle">Hypervisor</text>
<text x="995" y="423" text-anchor="middle">Overlay</text>
<text x="995" y="441" text-anchor="middle">vswitch6</text>

<!-- OVERLAY → BACKBONE -->
<line x1="185" y1="380" x2="185" y2="330" class="line"/>
<line x1="300" y1="380" x2="300" y2="330" class="line"/>
<line x1="415" y1="380" x2="415" y2="330" class="line"/>

<line x1="765" y1="380" x2="765" y2="330" class="line"/>
<line x1="880" y1="380" x2="880" y2="330" class="line"/>
<line x1="995" y1="380" x2="995" y2="330" class="line"/>

<!-- VM -->
<rect x="135" y="470" width="100" height="50" class="box"/>
<text x="185" y="500" text-anchor="middle">VM1</text>
<text x="185" y="515" text-anchor="middle">vswitch1</text>

<rect x="250" y="470" width="100" height="50" class="box"/>
<text x="300" y="500" text-anchor="middle">VM1</text>
<text x="300" y="515" text-anchor="middle">vswitch2</text>

<rect x="365" y="470" width="100" height="50" class="box"/>
<text x="415" y="500" text-anchor="middle">VM1</text>
<text x="415" y="515" text-anchor="middle">vpcpeer1</text>

<rect x="715" y="470" width="100" height="50" class="box"/>
<text x="765" y="500" text-anchor="middle">VM2</text>
<text x="765" y="515" text-anchor="middle">vswitch3</text>

<rect x="830" y="470" width="100" height="50" class="box"/>
<text x="880" y="500" text-anchor="middle">VM</text>
<text x="880" y="515" text-anchor="middle">external</text>

<rect x="945" y="470" width="100" height="50" class="box"/>
<text x="995" y="500" text-anchor="middle">VM2</text>
<text x="995" y="515" text-anchor="middle">vpcpeer2</text>

<!-- VM → OVERLAY -->
<line x1="185" y1="470" x2="185" y2="450" class="arrow"/>
<line x1="300" y1="470" x2="300" y2="450" class="arrow"/>
<line x1="415" y1="470" x2="415" y2="450" class="arrow"/>

<line x1="765" y1="470" x2="765" y2="450" class="arrow"/>
<line x1="880" y1="470" x2="880" y2="450" class="arrow"/>
<line x1="995" y1="470" x2="995" y2="450" class="arrow"/>

<!-- VPC PEERING -->
<line x1="415" y1="520" x2="415" y2="560" class="line"/>
<line x1="995" y1="520" x2="995" y2="560" class="line"/>
<line x1="415" y1="560" x2="995" y2="560" class="line"/>

<text x="705" y="555" text-anchor="middle">
Connected (VPCpeering)
</text>

<!-- FOOTNOTE -->
<text x="350" y="620">
VM launched and managed by Hypervisor
</text>

<text x="930" y="620">
NatOutgoing:true
</text>

</svg>
